name: Schema/SQL Check

# Schema reaches production through a hand-run `drizzle-kit push`, not a
# migration runner, so a column can be merged without ever existing in the
# database. That does not fail gracefully: drizzle names every column
# explicitly in its SELECTs, so the database rejects every query against
# the table and the whole app stops loading — which is what happened on
# 2026-08-13. This check makes that a red PR instead of an outage.
#
# Runs on every PR and on pushes to main. It needs no database, no
# secrets and no install step: it reads the schema and the SQL files
# straight from the checkout.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Schema columns have SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every schema column has SQL to create it
        run: node scripts/check-schema-sql.mjs
