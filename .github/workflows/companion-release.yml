name: Companion Release

on:
  push:
    branches:
      - main

# This workflow fires on every push to main and updates the same rolling
# "main"-tagged release. Frequent successive pushes previously queued
# overlapping runs that raced each other uploading assets to that one
# release, which GitHub's API doesn't handle gracefully — cancel any
# in-progress run for this workflow+ref when a newer push arrives so only
# the latest one ever touches the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # electron-updater compares this version against the running app's to
      # decide whether an update exists — package.json was previously
      # pinned at 0.0.1 forever, so every build looked identical to a
      # client checking for updates. run_number always increases, is
      # already unique per build, and needs no manual bump step.
      - name: Set build version
        shell: bash
        run: node -e "const fs=require('fs');const p='artifacts/companion/package.json';const j=JSON.parse(fs.readFileSync(p,'utf-8'));j.version='0.0.${{ github.run_number }}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
      - name: Build companion
        run: pnpm --filter @workspace/companion run build
      - name: Package companion
        run: pnpm --filter @workspace/companion run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-windows
          path: |
            artifacts/companion/dist/*.exe
            artifacts/companion/dist/latest.yml
            artifacts/companion/dist/*.blockmap
          if-no-files-found: error

  build-macos:
    name: Build macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # Kept in sync with the Windows build's version (see its "Set build
      # version" step) purely so app.getVersion() shown in the UI matches
      # across platforms for the same release — macOS doesn't check for
      # updates itself yet (unsigned build, see setupAutoUpdater).
      - name: Set build version
        shell: bash
        run: node -e "const fs=require('fs');const p='artifacts/companion/package.json';const j=JSON.parse(fs.readFileSync(p,'utf-8'));j.version='0.0.${{ github.run_number }}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
      - name: Build companion
        run: pnpm --filter @workspace/companion run build
      - name: Package companion
        run: pnpm --filter @workspace/companion run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-macos
          path: artifacts/companion/dist/*.dmg
          if-no-files-found: error

  release:
    name: Update GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: companion-windows
          path: dist
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: companion-macos
          path: dist

      # softprops/action-gh-release can only update a release if exactly one
      # exists for the tag. Stale/duplicate releases (e.g. an orphaned draft
      # left behind by an interrupted run) make it fail with
      # "Validation Failed: already_exists" on tag_name when finalizing.
      # Clear out anything already sitting on this tag before creating fresh.
      - name: Remove stale releases for tag "main"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases" --paginate \
            | jq -r '.[] | select(.tag_name == "main") | .id' \
            | while read -r id; do
                echo "Deleting stale release id $id"
                gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
              done

      # softprops/action-gh-release only sets a tag's target commit when
      # *creating* the tag — since "main" already exists from the previous
      # run, it stays pointed at whichever commit it was FIRST created at,
      # forever, even though the step above already deleted and recreated
      # the release object itself. That leaves the release page showing a
      # stale/wrong commit reference while the binaries underneath are
      # actually fresh (this cost real time to debug: the workflow run for
      # a given push always builds from that push's checkout — the tag's
      # displayed commit just lied about it). Delete the tag ref too so it
      # gets recreated at the commit that triggered this run.
      - name: Move tag "main" to this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/main" || true

      - name: Upload to GitHub release tagged "main"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main
          name: Latest (main)
          prerelease: true
          files: dist/*
