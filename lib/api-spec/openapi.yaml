openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Sim Racing HQ API — F1 sim companion
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: Racing session operations
  - name: setups
    description: Car setup operations
  - name: trackNotes
    description: Track notes operations
  - name: hardware
    description: Hardware settings operations
  - name: community
    description: Community setup sharing operations
  - name: companion
    description: Companion app API key and session upload
  - name: rivalChallenges
    description: Head-to-head time trial / race challenge operations
  - name: engineerUsage
    description: AI Race Engineer free-tier usage limit and unlock
  - name: friends
    description: Friend requests, friend list and the friends activity feed
  - name: leagues
    description: Leagues, membership, and the staff-only leaderboard and activity views
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sessions:
    get:
      operationId: getSessions
      tags: [sessions]
      summary: Get all sessions for current user
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/{id}:
    get:
      operationId: getSessionDetail
      tags: [sessions]
      summary: Get one session's per-lap metadata (no telemetry traces)
      description: >-
        Like GET /sessions, this omits lap telemetry traces to stay fast and
        cheap — it's used for per-lap metadata (times, sectors) and to
        populate the lap comparison picker. Fetch
        GET /sessions/{id}/laps/{lapNumber}/trace for a specific lap's full
        trace data.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session with per-lap metadata, traces omitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/laps/{lapNumber}/trace:
    get:
      operationId: getLapTrace
      tags: [sessions]
      summary: Get one lap's full telemetry trace
      description: >-
        Fetches just the telemetry trace for a single lap, so viewing or
        comparing a lap's telemetry never has to load every other lap's
        trace in the session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: lapNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The lap's telemetry trace (empty if none was recorded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  trace:
                    type: array
                    items:
                      $ref: "#/components/schemas/LapTraceSample"
                required:
                  - trace
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/share:
    post:
      operationId: shareSession
      tags: [sessions]
      summary: Toggle public sharing on a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareSessionRequest"
      responses:
        "200":
          description: Share state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /setups:
    get:
      operationId: getSetups
      tags: [setups]
      summary: Get all setups for current user
      responses:
        "200":
          description: List of setups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SetupRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSetup
      tags: [setups]
      summary: Create a new setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSetupRequest"
      responses:
        "201":
          description: Setup created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /setups/{id}:
    delete:
      operationId: deleteSetup
      tags: [setups]
      summary: Delete a setup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Setup deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /setups/{id}/share:
    post:
      operationId: shareSetup
      tags: [setups]
      summary: Toggle public sharing on a setup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Share state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareSetupResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /community/sessions:
    get:
      operationId: getCommunitySessions
      tags: [community]
      summary: Get all publicly shared sessions
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of community sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunitySessionRecord"

  /community/setups:
    get:
      operationId: getCommunitySetups
      tags: [community]
      summary: Get all publicly shared setups
      parameters:
        - name: trackId
          in: query
          required: false
          schema:
            type: string
        - name: car
          in: query
          required: false
          schema:
            type: string
        - name: tag
          in: query
          required: false
          schema:
            type: string
        - name: gameVersion
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of community setups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunitySetupRecord"

  /community/setups/{id}:
    get:
      operationId: getCommunitySetup
      tags: [community]
      summary: Get a single public community setup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Community setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunitySetupRecord"
        "404":
          $ref: "#/components/responses/NotFound"

  /community/setups/{id}/rate:
    post:
      operationId: rateSetup
      tags: [community]
      summary: Rate a community setup (1-5 stars)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateSetupRequest"
      responses:
        "200":
          description: Rating saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateSetupResponse"
        "400":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotFound"
        "404":
          $ref: "#/components/responses/NotFound"

  /community/setups/{id}/import:
    post:
      operationId: importSetup
      tags: [community]
      summary: Import a community setup into the caller's vault
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Setup imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /hardware:
    get:
      operationId: getHardware
      tags: [hardware]
      summary: Get all hardware profiles for current user
      responses:
        "200":
          description: List of hardware profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HardwareRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createHardware
      tags: [hardware]
      summary: Create a new hardware profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHardwareRequest"
      responses:
        "201":
          description: Hardware profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardwareRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hardware/{id}:
    delete:
      operationId: deleteHardware
      tags: [hardware]
      summary: Delete a hardware profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Hardware profile deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /track-difficulty:
    get:
      operationId: getTrackDifficulty
      tags: [trackNotes]
      summary: Get all track difficulty ratings for the current user
      responses:
        "200":
          description: List of track difficulty ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackDifficultyRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /track-difficulty/{trackId}:
    put:
      operationId: upsertTrackDifficulty
      tags: [trackNotes]
      summary: Set or clear a track difficulty rating
      parameters:
        - name: trackId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertTrackDifficultyRequest"
      responses:
        "200":
          description: Difficulty rating saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackDifficultyRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /companion/apikey:
    get:
      operationId: getCompanionApiKeyStatus
      tags: [companion]
      summary: Get API key status for the current user
      responses:
        "200":
          description: API key status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionApiKeyStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: generateCompanionApiKey
      tags: [companion]
      summary: Generate (or regenerate) an API key for the current user
      responses:
        "200":
          description: New raw API key — shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionApiKeyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: revokeCompanionApiKey
      tags: [companion]
      summary: Revoke the current user's API key
      responses:
        "204":
          description: Key revoked
        "401":
          $ref: "#/components/responses/Unauthorized"

  /companion/session:
    post:
      operationId: uploadCompanionSession
      tags: [companion]
      summary: Upload a session from the companion app (API key auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanionSessionRequest"
      responses:
        "201":
          description: Session uploaded — returns the created session record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRecord"
        "400":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /rival-challenges:
    get:
      operationId: getRivalChallenges
      tags: [rivalChallenges]
      summary: Get all rival challenges the current user sent or received
      responses:
        "200":
          description: List of rival challenges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RivalChallengeRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRivalChallenge
      tags: [rivalChallenges]
      summary: Challenge another user to beat one of your sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRivalChallengeRequest"
      responses:
        "201":
          description: Rival challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RivalChallengeRecord"
        "400":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /rival-challenges/lookup-user:
    get:
      operationId: lookupRivalChallengeUser
      tags: [rivalChallenges]
      summary: Look up a user by username to challenge them
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RivalChallengeUserLookup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /rival-challenges/{id}:
    delete:
      operationId: cancelRivalChallenge
      tags: [rivalChallenges]
      summary: Cancel a pending rival challenge you created
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Rival challenge cancelled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /rival-challenges/{id}/attempt:
    post:
      operationId: submitRivalChallengeAttempt
      tags: [rivalChallenges]
      summary: Submit your session as your attempt at a rival challenge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRivalChallengeAttemptRequest"
      responses:
        "200":
          description: Attempt submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RivalChallengeRecord"
        "400":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /rival-challenges/{id}/seen:
    post:
      operationId: markRivalChallengeSeen
      tags: [rivalChallenges]
      summary: Acknowledge the result of a completed rival challenge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Result acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RivalChallengeRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /engineer-usage:
    get:
      operationId: getEngineerUsage
      tags: [engineerUsage]
      summary: Get the current user's AI Race Engineer usage status
      responses:
        "200":
          description: Usage status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineerUsageStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /engineer-usage/check-and-increment:
    post:
      operationId: checkAndIncrementEngineerUsage
      tags: [engineerUsage]
      summary: Consume one AI Race Engineer message against the free-tier limit
      description: >
        Atomically increments the user's message count if they are unlocked
        or still under the free-tier limit, and reports whether the message
        is allowed to proceed.
      responses:
        "200":
          description: Usage status after the attempted increment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineerUsageStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /engineer-usage/unlock:
    post:
      operationId: unlockEngineerUsage
      tags: [engineerUsage]
      summary: Unlock unlimited AI Race Engineer usage with the shared password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockEngineerUsageRequest"
      responses:
        "200":
          description: Unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineerUsageStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Incorrect password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /track-notes/{trackId}:
    get:
      operationId: getTrackNotes
      tags: [trackNotes]
      summary: Get track notes for a specific track
      parameters:
        - name: trackId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Track notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackNotesRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: upsertTrackNotes
      tags: [trackNotes]
      summary: Create or update track notes for a specific track
      parameters:
        - name: trackId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertTrackNotesRequest"
      responses:
        "200":
          description: Track notes saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackNotesRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /friends:
    get:
      operationId: getFriends
      tags: [friends]
      summary: Get the current user's friends and pending friend requests
      responses:
        "200":
          description: Friends and pending requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: addFriend
      tags: [friends]
      summary: Send a friend request by username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFriendRequest"
      responses:
        "201":
          description: Friend request sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRecord"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already a friend or a request already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /friends/sessions:
    get:
      operationId: getFriendSessions
      tags: [friends]
      summary: Recent shared sessions from the current user's friends
      responses:
        "200":
          description: Friends' recent shared sessions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendSessionRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /friends/{id}/accept:
    post:
      operationId: acceptFriendRequest
      tags: [friends]
      summary: Accept a friend request sent to you
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Friend request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /friends/{id}:
    delete:
      operationId: removeFriend
      tags: [friends]
      summary: Remove a friend, decline a request, or cancel one you sent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /leagues:
    get:
      operationId: getLeagues
      tags: [leagues]
      summary: Leagues the current user belongs to
      responses:
        "200":
          description: Leagues, staff ones first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeagueRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createLeague
      tags: [leagues]
      summary: Create a league — the creator becomes its owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeagueRequest"
      responses:
        "201":
          description: League created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueRecord"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /leagues/join:
    post:
      operationId: joinLeague
      tags: [leagues]
      summary: Join a league with its invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinLeagueRequest"
      responses:
        "201":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueRecord"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already a member of that league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{id}:
    get:
      operationId: getLeague
      tags: [leagues]
      summary: One league and its roster
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: League and members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteLeague
      tags: [leagues]
      summary: Delete a league (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /leagues/{id}/join-code:
    post:
      operationId: regenerateLeagueJoinCode
      tags: [leagues]
      summary: Issue a fresh invite code, retiring the old one (staff only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: League with its new code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /leagues/{id}/members/{userId}:
    patch:
      operationId: updateLeagueMemberRole
      tags: [leagues]
      summary: Promote or demote a member (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeagueMemberRoleRequest"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueMemberRecord"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeLeagueMember
      tags: [leagues]
      summary: Remove a member, or leave the league yourself
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "400":
          description: The owner cannot leave their own league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /leagues/{id}/leaderboard:
    get:
      operationId: getLeagueLeaderboard
      tags: [leagues]
      summary: League leaderboard for one track (staff only)
      description: >
        Best lap per member on a track, with the gap to the leader and who
        has not set a time yet. Staff only — this is the view league
        organisers get that members do not.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: trackId
          in: query
          required: false
          description: Track to rank on. Defaults to the league's most driven track.
          schema:
            type: string
        - name: days
          in: query
          required: false
          description: Only count sessions from the last N days. Omit for all time.
          schema:
            type: integer
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueLeaderboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /leagues/{id}/activity:
    get:
      operationId: getLeagueActivity
      tags: [leagues]
      summary: Who is actually practising in this league (staff only)
      description: >
        Per-driver practice activity over a rolling window — sessions, laps,
        seat time, tracks driven and when they were last on — plus league
        totals and a daily session count. Staff only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          description: Window length in days (default 30).
          schema:
            type: integer
      responses:
        "200":
          description: Activity board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueActivity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"


